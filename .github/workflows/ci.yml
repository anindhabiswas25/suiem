name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm depcruise
      - run: pnpm test
  integration:
    runs-on: ubuntu-24.04
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      # Testcontainers starts Postgres 16 and Redis; anvil is spawned by the chain boot tests and by
      # the orders test, which deploys the real contracts to a local anvil (chain 46630).
      - run: pnpm contracts:build
      - run: pnpm test:integration
  extension-e2e:
    runs-on: ubuntu-24.04
    needs: static
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @suiem/extension exec playwright install --with-deps chromium
      # The E2E setup deploys the burnable $WIF mock (packages/contracts/out) to a local 4663 chain.
      - run: pnpm contracts:build
      # Builds the E2E variant, starts Postgres/Redis containers, local anvils, the API and a counting proxy.
      - run: pnpm test:e2e:extension
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 foundry-rs/forge-std@v1.16.2 --no-git
        working-directory: packages/contracts
      - run: forge build
        working-directory: packages/contracts
      - run: forge test
        working-directory: packages/contracts
