# Local development stack (PO: hosted on Vercel + Railway from Sprint 8; nothing here is deployed).
# Credentials are LOCAL-ONLY defaults and protect nothing of value.
name: suiem
services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_USER: suiem
      POSTGRES_PASSWORD: ${SUIEM_PG_PASSWORD:-local_only}
      POSTGRES_DB: suiem
      SUIEM_APP_PASSWORD: ${SUIEM_PG_APP_PASSWORD:-local_only_app}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suiem -d suiem"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Forks for tests only (`docker compose --profile test up`). Nothing is ever broadcast to the
  # real networks from these. Mainnet fork is used for Sprint 7 $WIF contract tests.
  anvil-mainnet-fork:
    profiles: [test]
    image: ghcr.io/foundry-rs/foundry:v1.8.3
    entrypoint:
      [
        "anvil",
        "--host",
        "0.0.0.0",
        "--port",
        "8546",
        "--fork-url",
        "${MAINNET_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}",
      ]
    ports: ["127.0.0.1:8546:8546"]
  anvil-testnet-fork:
    profiles: [test]
    image: ghcr.io/foundry-rs/foundry:v1.8.3
    entrypoint:
      [
        "anvil",
        "--host",
        "0.0.0.0",
        "--port",
        "8547",
        "--fork-url",
        "${TESTNET_RPC_URL:-https://rpc.testnet.chain.robinhood.com}",
      ]
    ports: ["127.0.0.1:8547:8547"]
volumes:
  pgdata:
